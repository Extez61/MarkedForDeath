#   Made by ~extez061
#   https://modrinth.com/user/Extez0612
# ============================================================

# Language for in-game messages.
# Supported values: en (English), tr (Turkish)
language: en

game:
  # Total game duration in seconds after the runner touches a player.
  # Default: 600 (10 minutes)
  duration: 600

  # Minimum number of online players required to start the game.
  # Setting to 2 will start games without an Imposter (Runner vs 1 Guardian only).
  min-players: 3

  # Controls who can see the task name in the action bar.
  #   1 = only_runner          -> Only the Runner sees the task; others see a countdown timer.
  #   2 = imposter_and_runner  -> Runner and Imposter both see the task; guardians see timer.
  #   3 = everyone             -> All players see the task and the countdown timer.
  task-visibility: 1

  # If the Imposter also sees the task (task-visibility 2 or 3), the action bar
  # shows "Runner's Task:" instead of "Task:" to the Imposter, since it is not
  # their own task to complete.

  # Controls whether the Runner is told (via chat, in addition to the Imposter's
  # own private title-screen reveal) who their secret Imposter ally is.
  #   1 = disabled -> The Runner is not told (default).
  #   2 = enabled  -> The Runner is told via chat at the start of the game.
  show-imposter-to-runner-in-chat: 1

  # Distance in blocks used during the waiting-for-touch phase.
  # If no guardian/imposter is within this range of the runner, a
  # reminder broadcast is sent every 15 seconds to prompt the runner to find someone.
  runner-max-distance: 15

  # If true (default), all players in the game may drop items freely.
  # If false, dropping items is blocked for every game participant.
  allow-item-drop: true

  # Controls the keepInventory gamerule while a game is running.
  # true  (default) → Players keep their items on death during the game.
  # false           → Players lose their items on death (vanilla behaviour).
  # The original gamerule value is restored automatically when the game ends.
  keep-inventory: true

  # Blocks building/item use/throwing until the Runner touches someone.
  restrict-actions-before-touch: true

# ── Task toggles ───────────────────────────────────────────────────────────
# Each task below can be enabled (true) or disabled (false).
# Disabled tasks will never be randomly selected at game start.
tasks:
  lava-death: true
  drowning: true
  magma-block: true
  creeper: true
  suffocation: true
  skeleton: true
  zombie: true
  spider: true
  iron-golem: true
  fall-damage: true
  cactus: true
  berry-bush: true
  anvil: false
  lightning: false
  wither-effect: false

# ── Update checker ──────────────────────────────────────────────────────────
update-checker:
  # Checks Modrinth for updates on startup.
  enabled: true

# Kit definitions have been moved to kits.yml.
# Use /mfd kiteditgui or /mfd kitedit <runner|guardians|imposter> to edit them in-game.

# Internal, do not edit — used for config auto-updates.
config-version: 1